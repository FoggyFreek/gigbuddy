sonar.projectKey=FoggyFreek_gigbuddy
sonar.organization=foggyfreek

# Path to sources
sonar.sources=src,server,public

# Exclude build output, dependencies, generated files, and tests from the source scope
sonar.exclusions=node_modules,dist,coverage,public/icons,public/manifest.json,src/tests/**,src/**/__tests__/**,server/db/migrations/**

# Classify both centralized and co-located tests as tests. They remain available to
# the scanner and their LCOV results still provide coverage for production code.
sonar.tests=src
sonar.test.inclusions=src/tests/**,src/**/__tests__/**

# Tests are coverage inputs, but are not coverage targets themselves.
sonar.coverage.exclusions=src/tests/**,src/**/__tests__/**

# Do not report issues from any rule in test files.
sonar.issue.ignore.multicriteria=centralizedTests,colocatedTests
sonar.issue.ignore.multicriteria.centralizedTests.ruleKey=*
sonar.issue.ignore.multicriteria.centralizedTests.resourceKey=src/tests/**
sonar.issue.ignore.multicriteria.colocatedTests.ruleKey=*
sonar.issue.ignore.multicriteria.colocatedTests.resourceKey=src/**/__tests__/**

# Source encoding
sonar.sourceEncoding=UTF-8

# Test coverage: one LCOV per suite (frontend src + backend server), merged by Sonar
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info,coverage/server/lcov.info

# Exclusions for copy-paste detection (tests, SQL migrations, and icon components are legitimately repetitive)
sonar.cpd.exclusions=src/tests,server/db/migrations,src/components/icons
